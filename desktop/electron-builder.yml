# electron-builder configuration for APM Open Player (Windows + macOS).
#
# The decode engine is libmpv, which upstream requires to be redistributed
# unmodified. The libmpv binaries ship in the `vendor/mpv` folder and are
# unpacked alongside the app.

appId: com.apm.openplayer
productName: APM Open Player
copyright: Copyright © APM Open Player Contributors

directories:
  output: dist
  buildResources: build

# Native module (koffi) must be unpacked from the asar archive so that its
# .node binary can be dlopen'd.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/*.node"

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!dist/**"
  # npm 10 - which is what CI runs - leaves a junction here:
  #   desktop/node_modules/apm-open-player  ->  the repository root
  # because it links the project it just installed. electron-builder walks
  # node_modules, follows the junction, and packs the entire repository into
  # the installer - including desktop/dist/win-unpacked, which electron-builder
  # is writing at that exact moment, plus release/ and .git. That is what
  # turned a 174 MB installer into 313 MB, and it grows with every run.
  # The workflow also deletes the junction; this is here so the bug cannot
  # come back through a different npm version.
  - "!node_modules/apm-open-player"
  - "!node_modules/apm-open-player/**"

extraResources:
  - from: vendor/mpv
    to: mpv
    filter:
      - "**/*"

win:
  target:
    # 64-bit only, and that is not a choice we made. Electron stopped
    # publishing win32-ia32 builds: v44.7.1 ships x64 and arm64 and
    # nothing else, and the ia32 zip 404s. Every 32-bit Windows build of
    # this app would have to pin Electron 22 from 2023 and ship whatever
    # CVEs have landed since, which is worse than not offering the build.
    # Windows 10 and 11 both run the x64 build, so almost every machine
    # that could use a 32-bit player can run this one instead.
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Unsigned by default: shipping without a code-signing certificate is normal
  # for a source release. SmartScreen will warn until you sign it.
  signAndEditExecutable: true
  legalTrademarks: none
  requestedExecutionLevel: asInvoker

nsis:
  # ${arch} in the name so a future second Windows architecture lands beside
  # this one instead of silently overwriting it.
  artifactName: "APM-Open-Player-${version}-Windows-${arch}-Setup.exe"
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: APM Open Player
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
  language: "1033"
  # Ties the file extensions to the installer so the app can be chosen as the
  # default player from Explorer.
  include: build/installer.nsh

portable:
  artifactName: "APM-Open-Player-${version}-Windows-${arch}-Portable.exe"
  requestExecutionLevel: user

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  # Built by tools/make-icns.js from the PNGs that make-icon.ps1 renders.
  # It is not an electron-builder conversion - that only happens for .ico.
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: APM Open Player does not record audio.
    NSScreenCaptureUsageDescription: APM Open Player can capture single video frames as snapshots.
  # Placeholder identity so `electron-builder --mac` produces a runnable
  # bundle on any machine. Replace with your own Developer ID for distribution.
  identity: null

dmg:
  artifactName: "APM-Open-Player-${version}-${arch}.dmg"
  title: "APM Open Player ${version}"

afterSign: null
afterPack: null