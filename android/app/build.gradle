plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apm.openplayer'
    // libVLC 3.7.x requires consumers to compile against API 36.
    compileSdk 36

    defaultConfig {
        applicationId "com.apm.openplayer"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Real phones only. x86/x86_64 exist solely for emulators and add
        // ~100 MB to the APK (libvlc.so is 38-52 MB per ABI), so they are off.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // Debug keystore fallback keeps `assembleRelease` working out of
            // the box; replace with your own keystore before publishing.
            storeFile file(project.findProperty('APM_STORE_FILE') ?: "${rootDir}/keystore/apm-debug.jks")
            storePassword project.findProperty('APM_STORE_PASSWORD') ?: 'apmdebug'
            keyAlias project.findProperty('APM_KEY_ALIAS') ?: 'apmdebug'
            keyPassword project.findProperty('APM_KEY_PASSWORD') ?: 'apmdebug'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // libVLC ships large native libraries; do not strip or compress them
        // twice or the .so loader fails on some devices.
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.media:media:1.7.0'

    // The universal decode engine: libVLC/FFmpeg for Android. This is the
    // whole point of the app - it plays the codecs Android itself refuses.
    implementation 'org.videolan.android:libvlc-all:3.7.7'

    testImplementation 'junit:junit:4.13.2'
}