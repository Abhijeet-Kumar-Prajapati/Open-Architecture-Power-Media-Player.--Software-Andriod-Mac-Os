name: build

# Windows and Android can be built on any runner. The macOS .dmg requires
# macOS, so it is gated to macos-latest.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: |
          npm --prefix desktop install
          npm approve-scripts --yes koffi || true

      - name: Unit / static checks
        run: |
          for f in desktop/src/main/*.js desktop/src/preload/*.js desktop/src/renderer/js/*.js tools/*.js tools/lib/*.js; do
            node --check "$f" || exit 1
          done
          echo "syntax OK"

      - name: Zip round-trip and test media
        # The release archive is built by tools/lib/zip-stream.js. A silent
        # offset error there would not fail the build - it would produce an
        # archive that opens and then breaks on the 40th entry, for whoever
        # downloads it. Authoring real media also proves the ffmpeg and
        # ffprobe binaries arrive inside the npm packages rather than from
        # whatever happens to be on the runner's PATH.
        run: |
          node tools/test-zip-stream.js
          node tools/make-testmedia.js

      # Decoding is deliberately not attempted here. tools/test-decode.js
      # drives libmpv, which is a Windows DLL, so it can only run on the
      # Windows job where that binary is fetched. The old workflow ran it on
      # ubuntu, where it failed on every single run.

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm --prefix desktop install
          npm approve-scripts --yes koffi || true

      - name: Break the npm self-link
        # npm 10 leaves a junction at desktop/node_modules/apm-open-player
        # pointing back at the repository root, because it links the project
        # it just installed. electron-builder walks node_modules, follows it,
        # and packs the whole repository - including desktop/dist/win-unpacked,
        # which it is writing at that moment - into the installer. That is the
        # difference between a 174 MB download and a 313 MB one.
        #
        # electron-builder.yml excludes it too; this is the belt to that
        # braces, and it fails loudly here rather than silently shipping 140 MB
        # of repository to every user.
        run: node tools/break-npm-selflink.js

      - name: Fetch libmpv
        # Upstream renamed these assets to embed the build date -
        # mpv-dev-x86_64.7z became mpv-dev-x86_64-20261014-git-<sha>.7z -
        # so a hardcoded filename 404s the moment they publish. Ask the
        # API for the newest release and match the asset by pattern.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers @{ 'User-Agent' = 'apm-build' }
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-[0-9]' } |
            Select-Object -First 1
          if (-not $asset) { throw "no x86_64 libmpv asset in $($rel.tag_name)" }

          $dir = "desktop/vendor/mpv"
          New-Item -ItemType Directory -Force $dir | Out-Null
          "using $($asset.name)  $([math]::Round($asset.size/1MB,1)) MB"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$dir/mpv.7z"
          7z x "$dir/mpv.7z" "-o$dir" -y
          Remove-Item "$dir/mpv.7z" -Force

          $dll = Join-Path $dir 'libmpv-2.dll'
          if (-not (Test-Path $dll)) { throw "libmpv-2.dll missing after extraction" }
          "  libmpv-2.dll  $([math]::Round((Get-Item $dll).Length/1MB,1)) MB"
      - name: Generate test media
        # The smoke test needs a real 60-second clip. A shorter one reaches EOF
        # before the sample point and fails for the wrong reason.
        run: node tools/make-testmedia.js

      - name: Decode every format through the 64-bit engine
        # The whole point of the verification report. It has to run here
        # rather than on the Linux job because libmpv-2.dll is a Windows
        # binary, and it has to run against the engine staged above,
        # which is the exact one the 64-bit installer will ship.
        run: node tools/test-decode.js

      - name: Build the 64-bit installer
        run: npm --prefix desktop run dist:win:x64

      - name: Smoke test the 64-bit build
        # Not the dev binary - the thing that actually ships. Needs a real
        # desktop session, which is why this is on the Windows runner only.
        shell: pwsh
        run: |
          node tools/smoke-electron.js tools/testmedia/smoke-60s.mp4 35 `
            "desktop/dist/win-unpacked/APM Open Player.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage the Windows installers
        # Staging only. The all-in-one archive is assembled by the release job
        # at the end, because this runner never has the macOS bundles or the
        # APK - those are built on other machines. Asking for them here was
        # guaranteed to fail, after a six minute build.
        run: node tools/package-release.js stage-windows

      - uses: actions/upload-artifact@v4
        with:
          name: apm-open-player-windows
          path: release/*.exe
          if-no-files-found: error
          # Already compressed. Re-deflating 627 MB of NSIS installers costs
          # minutes of runner time and saves nothing.
          compression-level: 0

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Create a throwaway signing key
        # app/build.gradle falls back to android/keystore/apm-debug.jks with
        # these exact credentials so `assembleRelease` works without any
        # secrets. Keystores are git-ignored, so CI has to mint its own.
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/apm-debug.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias apmdebug -storepass apmdebug -keypass apmdebug \
            -dname "CN=APM Open Player, OU=CI, O=APM, C=IN"

      - name: Cache the libVLC AAR (88 MB, slow to fetch)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-*
          key: libvlc-3.7.7-${{ runner.os }}

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Stage the APK
        # Gradle calls it app-release.apk. Every download link in the README,
        # the website and the release page uses the product name instead.
        run: node tools/package-release.js stage-android

      - uses: actions/upload-artifact@v4
        with:
          name: apm-open-player-android
          path: release/*.apk
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm --prefix desktop install
          npm approve-scripts --yes koffi || true

      - name: Build both architectures
        # tools/build-macos.js rather than electron-builder, because it produces
        # the same two .app bundles but does not need a macOS host - it rewrites
        # the official Electron zip in memory instead of unpacking it. That
        # keeps this job useful on any runner.
        run: node tools/build-macos.js

      # build-macos.js writes straight into release/ under the release names,
      # so there is nothing to stage here - only to check they arrived.
      - name: Check the macOS archives
        run: |
          set -e
          for a in arm64 x64; do
            f="release/APM-Open-Player-*-macos-$a.zip"
            ls $f >/dev/null || { echo "missing $f"; exit 1; }
            echo "  $f  $(du -h $f | cut -f1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apm-open-player-macos
          path: release/APM-Open-Player-*-macos-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Build the .dmg
        # Optional: needs macOS tooling, and produces no benefit over the zips.
        run: npm --prefix desktop run dist:mac
        continue-on-error: true

  release:
    name: Release package
    # The only job that sees every artifact. Each platform is built on its own
    # runner, so the archives that span platforms can only be assembled once
    # all of them have finished.
    needs: [verify, windows, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect every platform build
        uses: actions/download-artifact@v4
        with:
          pattern: apm-open-player-*
          path: release
          merge-multiple: true

      - name: List what arrived
        run: ls -la release/

      - name: Build the source and all-in-one archives
        run: node tools/package-release.js assemble

      - uses: actions/upload-artifact@v4
        with:
          name: apm-open-player-release
          path: |
            release/*
          if-no-files-found: error